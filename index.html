<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Marginalia</title>
    <!--
      Fonts are bundled, not fetched. This head previously linked Google Fonts, which meant the
      app reached out to fonts.googleapis.com on every launch: a network round trip before first
      paint, a visible fallback-font flash with no connection, and a claim of "nothing leaves this
      computer" that was not quite true. They are now installed as @fontsource packages and
      imported from src/index.css, so they load from disk and work offline.
    -->
  </head>
  <body class="bg-[#f9f9f7] text-[#1c2321] antialiased selection:bg-[#476055]/20 selection:text-[#1c2321]">
    <main id="root"></main>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
