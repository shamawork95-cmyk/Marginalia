# Builds the desktop app and attaches the installers to a GitHub Release.
#
# Windows installers are built on a Windows runner rather than cross-compiled: electron-builder
# needs Wine to produce an NSIS installer from macOS or Linux, and a native runner avoids that
# dependency entirely. macOS builds on macOS for the same reason.
#
# Triggered by pushing a version tag (`v1.2.3`), or manually from the Actions tab.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failing should not discard the installer the other one produced.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis
            artifact: 'release/*.exe'
          - os: macos-latest
            target: --mac dmg
            artifact: 'release/*.dmg'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build

      - name: Package the installer
        # `--publish never` keeps electron-builder from trying to create the release itself; the
        # upload is done explicitly below so both platforms land on the same release.
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned builds. Without this electron-builder looks for signing identities on macOS
          # and fails the job when it cannot find any.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installer to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" ${{ matrix.artifact }} --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Also kept as a workflow artifact, so a manual run without a tag still produces something
      # downloadable.
      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: marginalia-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
