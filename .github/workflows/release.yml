# Builds the desktop app and publishes it to a GitHub Release.
#
# Windows installers are built on a Windows runner rather than cross-compiled: electron-builder
# needs Wine to produce an NSIS installer from macOS or Linux, and a native runner avoids that
# dependency entirely. macOS builds on macOS for the same reason.
#
# `--publish always` lets electron-builder create/update the release itself, rather than
# uploading installers to one made by hand — that is what also generates and uploads
# latest.yml / latest-mac.yml, the manifests a running copy of the app reads (via
# electron-updater) to tell whether a newer version exists. Both OS jobs publish to the release
# matching the version in package.json, so it ends up with installers for both platforms; because
# releaseType is set to "release" in package.json, it goes live immediately with no manual step.
#
# Each platform job uploads into a DRAFT release, and a final job publishes that draft once both
# have finished. electron-builder can only attach assets to a release it created itself or to one
# still in draft: against an already-published release it tries to create the tag again and gets
# `422 already_exists`, having already uploaded a blockmap or two. That is what left v2.0.0 with
# macOS installers, no Windows installer and no latest.yml — and on one of the two repos the job
# reported success while doing it, so the release looked fine and Windows could not update at all.
#
# Triggered by pushing a version tag (`v1.2.3`), or manually from the Actions tab — either way,
# bump "version" in package.json first, or the publish step will collide with the last release.
# The git tag only decides when this workflow runs; the release name, installer filenames, and
# what electron-updater compares against are all taken from "version" in package.json, not the
# tag string.
#
# package.json deliberately has no "repository" field and the publish config has no owner/repo:
# this file lives in both a fork and its upstream, and omitting them lets electron-builder infer
# the target repo from the `origin` remote actions/checkout sets up — so each repo's own workflow
# run publishes to its own releases, with no shared config to get out of sync between the two.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failing should not discard the installer the other one produced.
      fail-fast: false
      # Both jobs publish to the *same* release (matched by the version in package.json). Run
      # them one at a time: electron-builder's GitHub publisher has a known race when two
      # processes update the same release concurrently — one can recreate the release object
      # mid-flight and silently drop the assets the other already uploaded.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            target: --win
            artifacts: |
              release/*.exe
              release/latest.yml
          - os: macos-latest
            target: --mac
            artifacts: |
              release/*.dmg
              release/*.zip
              release/latest-mac.yml

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build

      # Types and every test, after the build (tsc reads the fresh dist/) and before any
      # installer is made: a release never ships with a failing check.
      - name: Check types and run the tests
        run: npm test

      # `--publish never`: NEITHER platform job talks to GitHub. Both used to, and the second one
      # to run recreated the release and dropped what the first had uploaded — which is how
      # v2.0.0 and v2.1.0 both ended up with one platform's installers and not the other's. The
      # update manifests are still generated here, because a publish provider is configured; they
      # just travel as build artifacts like everything else.
      - name: Package the app
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned builds. Without this electron-builder looks for signing identities on macOS
          # and fails the job when it cannot find any. Note: an unsigned macOS build can still be
          # published this way, but Squirrel.Mac (electron-updater's macOS mechanism) refuses to
          # apply an update to an unsigned app, so auto-update only actually installs itself on
          # Windows until this app is code-signed and notarized.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Also kept as a workflow artifact, so a manual run without a tag still produces something
      # downloadable even before the release goes up.
      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: marginalia-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  # The draft holds every platform's assets by the time this runs, so publishing it is the moment
  # the release becomes real — and it becomes real complete, rather than going live after the
  # first platform and leaving the second unable to attach to it.
  # One writer. Every installer and manifest is collected here and uploaded in a single pass, so
  # nothing can be recreated out from under anything else.
  publish:
    needs: build
    runs-on: ubuntu-latest
    # Only for a real tag. A manual run still produces downloadable build artifacts, but it should
    # not flip a draft live.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v7

      - name: Collect every platform's installers
        uses: actions/download-artifact@v8
        with:
          path: incoming

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION — refusing to publish."
            echo "The release is named from package.json, so these must agree."
            exit 1
          fi

          # Flatten: download-artifact nests each artifact under its own directory.
          mkdir -p upload
          cp incoming/*/* upload/
          echo "Uploading:"
          ls -1 upload | sed 's/^/  /'

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" upload/* --clobber
            gh release edit "$TAG" --draft=false --latest
          else
            gh release create "$TAG" upload/* --title "$TAG" --generate-notes --latest
          fi
          echo "Published $TAG"

      # A release with no Windows installer is the failure this workflow exists to prevent, and it
      # is invisible unless something checks. Both update manifests must be there too, or a
      # running copy of the app cannot see the release at all.
      - name: Check the release is complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAMES="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')"
          MISSING=""
          echo "$NAMES" | grep -q '\.exe$'      || MISSING="$MISSING Windows-installer"
          echo "$NAMES" | grep -q '\.dmg$'      || MISSING="$MISSING macOS-dmg"
          echo "$NAMES" | grep -qx 'latest.yml'  || MISSING="$MISSING latest.yml"
          echo "$NAMES" | grep -qx 'latest-mac.yml' || MISSING="$MISSING latest-mac.yml"
          if [ -n "$MISSING" ]; then
            echo "Release is missing:$MISSING"
            exit 1
          fi

          # Every filename a manifest points at must actually be on the release. This is not
          # implied by the checks above: GitHub rewrites spaces in an uploaded filename to dots,
          # so an installer built as "Marginalia Setup 2.2.0.exe" arrives as
          # "Marginalia.Setup.2.2.0.exe" while latest.yml still asks for the hyphenated name
          # electron-builder's own publisher would have used. The release then looks complete,
          # the app finds the manifest, and the download 404s — which the app reports as being
          # unable to check for updates at all. Installer filenames are pinned space-free in
          # package.json so this cannot recur; this check is what would notice if it did.
          for MANIFEST in latest.yml latest-mac.yml; do
            gh release download "${GITHUB_REF_NAME}" --pattern "$MANIFEST" --output "$MANIFEST" --clobber
            for WANTED in $(grep -oE '^\s+- url: .+$' "$MANIFEST" | sed 's/.*url: //'); do
              echo "$NAMES" | grep -qxF "$WANTED" || {
                echo "$MANIFEST points at '$WANTED', which is not on the release."
                exit 1
              }
            done
          done
          echo "Release carries installers and update manifests for both platforms,"
          echo "and every file the manifests reference is present."
